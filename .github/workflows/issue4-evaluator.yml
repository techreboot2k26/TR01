name: Issue 4 Evaluator CI

on:
  workflow_dispatch:
  workflow_call:

jobs:
  evaluate:
    name: Issue 4 Evaluator
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Issue 4 Evaluator
        run: python -m pytest tests/test_issue4_evaluator.py
